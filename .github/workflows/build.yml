name: Build Executables

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install macOS ODBC Driver Dependencies
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install unixodbc

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyodbc PyQt6 PyQt6-Charts

    - name: Build with PyInstaller
      run: |
        pyinstaller --windowed --collect-all PyQt6.QtCharts --name "MSSQLMonitor" dashboard.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mssql-monitor-${{ matrix.os }}
        path: dist/